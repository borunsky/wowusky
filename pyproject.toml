[build-system]
requires      = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name        = "wowusky"
version     = "0.9.0"
description = "Minimalist World of Warcraft addon manager for Linux"
readme      = "README.md"
license     = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "wowusky contributors" }]
keywords    = ["wow", "world-of-warcraft", "addons", "linux", "manager"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Games/Entertainment",
  "Topic :: Utilities",
]
# Standard library only.
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest >= 7",
  "ruff   >= 0.4",
  "build  >= 1.0",
]

[project.urls]
Homepage = "https://github.com/borunsky/wowusky"
Issues   = "https://github.com/borunsky/wowusky/issues"
Source   = "https://github.com/borunsky/wowusky"

[project.scripts]
wowusky = "wowusky.__main__:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["wowusky*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
wowusky = [
  "catalog/manifests/*.json",
  "catalog/*.md",
  "assets/*.svg",
  "assets/*.png",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths  = ["tests"]
# Strict defaults so collection errors and config typos can never go
# unnoticed in a "green" run. -ra surfaces non-passing outcomes in
# the summary; --strict-markers/--strict-config turn typos into
# errors instead of silent skips.
addopts = "-ra --strict-markers --strict-config"
# Tests must use undecorated assertions or registered markers.
xfail_strict = true
