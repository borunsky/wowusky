name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    name: "Lint & test (Python ${{ matrix.python }})"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install -U pip
          pip install pytest ruff build

      - name: Ruff lint
        run: ruff check wowusky tests

      - name: Syntax check
        run: python -m py_compile wowusky/app.py wowusky/__main__.py

      - name: Import smoke (catches missing modules ruff/py_compile can't see)
        run: |
          python -c "import wowusky"
          python -c "import wowusky.providers; from wowusky.providers import get_provider, list_providers; assert get_provider('github').name == 'github'"
          python -c "import wowusky.tools.health_check"
          python -c "from wowusky.catalog import load_catalog; assert len(load_catalog()) > 0"

      - name: Catalog health check (offline)
        # Exercises provider registry + resolve for every shipped
        # catalog entry. No network. Catches typo'd provider names
        # and unresolvable references introduced by manifest edits.
        run: python -m wowusky.tools.health_check --offline

      - name: Tests
        run: pytest -q

  build-package:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip build
      - name: Build sdist + wheel
        run: python -m build
      - name: Install built wheel and import it
        run: |
          python -m pip install dist/*.whl
          python -c "import wowusky; print('wowusky', wowusky.__version__)"
          python -c "from wowusky.catalog import load_catalog; print('catalog:', len(load_catalog()))"
      - uses: actions/upload-artifact@v4
        with:
          name: wowusky-dist
          path: dist/
